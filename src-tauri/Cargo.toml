[package]
name = "tpt-startup"
description = "Smart Startup & Background Service Manager (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "tpt_startup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde.workspace = true
serde_json.workspace = true
tpt-startup-core = { path = "../core" }

[target.'cfg(target_os = "windows")'.dependencies]
tpt-startup-windows = { path = "../platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
tpt-startup-linux = { path = "../platform-linux" }
